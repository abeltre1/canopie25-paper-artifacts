name: boxy-ci

on:
  push:
    # Every feature branch is tested on push, not just an enumerated few: with
    # the work split across PRs, a branch that hadn't been listed here got no CI
    # at all until its PR existed — so a push could sit unverified for as long
    # as opening the PR took. `claude/**` covers the whole family; main/master
    # stay listed explicitly.
    branches: ["claude/**", "main", "master"]
    paths: ["boxy/**", ".github/workflows/boxy-ci.yml"]
  pull_request:
    paths: ["boxy/**", ".github/workflows/boxy-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # NOTE: no macOS leg. GitHub's hosted macOS runners ship no container
        # runtime (podman/docker/apptainer), so boxy's dryrun tests can't resolve
        # one, and one backend test is deliberately Linux-specific (the darwin
        # network path publishes ports instead of --network=host). macOS is a
        # best-effort target, verified locally; adding a green macOS leg would
        # need a runtime install + Linux-only test markers (tracked for 0.2).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install boxy (+ramalama, test deps)
        # ruff is PINNED to the 0.15 line: 0.16.0 changed default rule selection
        # and lit up hundreds of style findings across the pre-existing tree
        # (first seen: PR CI red on files the PR never touched). Bump the pin
        # deliberately, together with the style sweep it demands.
        run: python -m pip install -e 'boxy[ramalama,s3,plot,test]' 'ruff<0.16'
      - name: Lint (ruff)
        run: ruff check boxy/src boxy/tests
      - name: Unit + golden tests
        # degraded_and_live needs ramalama ABSENT / a live container runtime — CI
        # covers the deterministic suite (dryrun/golden/e2e-with-fakes).
        working-directory: boxy
        run: python -m pytest -q --ignore=tests/test_degraded_and_live.py

  degraded:
    # boxy PROMISES to work without RamaLama — accelerator detection is native
    # now, and registry transport pulls explain themselves instead of crashing.
    # tests/test_degraded_and_live.py proves that, but it needs ramalama
    # genuinely NOT importable, so the `test` job above excludes it and the whole
    # promise went unverified in CI. This leg installs boxy WITHOUT the ramalama
    # extra — the default install — so those tests actually run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boxy WITHOUT the ramalama extra
        # This is the DEFAULT install (`pip install boxy-hpc`), not a broken one:
        # ramalama is optional, so omitting the extra is all it takes.
        run: python -m pip install -e 'boxy[test]'
      - name: Assert the precondition (ramalama really absent)
        # If a transitive dep ever pulls ramalama in, the degradation tests would
        # silently self-skip and this leg would pass while proving nothing.
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("ramalama") is not None:
              sys.exit("ramalama is importable — the degraded leg would skip and prove nothing")
          print("precondition OK: ramalama absent")
          PY
      - name: Degradation tests (no RamaLama)
        working-directory: boxy
        # -rs surfaces any skip in the log; the live-Docker test in this file
        # still self-skips (no demo image on the runner), which is expected.
        run: python -m pytest tests/test_degraded_and_live.py -q -rs

  package:
    # Prove the distribution actually builds, passes twine metadata checks, and
    # installs cleanly — the same artifact the release workflow will publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build twine
          python -m build boxy
      - name: Metadata check
        run: python -m twine check boxy/dist/*
      - name: Install the wheel and smoke-test the entry points
        run: |
          python -m pip install boxy/dist/*.whl
          boxy --version
          python -m boxy --version
          boxy config >/dev/null
          boxy examples >/dev/null
      - name: Upload the installable wheel (per-commit artifact)
        # Every push's Actions run carries the built wheel + sdist: download it
        # from the run page (or `gh run download`) and `pip install` anywhere —
        # no local build needed.
        uses: actions/upload-artifact@v4
        with:
          name: boxy-wheel-${{ github.sha }}
          path: |
            boxy/dist/*.whl
            boxy/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Build both boxy container flavors (from the same wheel)
        # Containerized boxy: the CLI + OpenSSH client in one image, runnable
        # anywhere — hardened (Red Hat hi/python builder) and slim (official
        # python, Debian). CI proves both build and answer on every push; the
        # release workflow fans the full python-version matrix out to GHCR.
        run: |
          docker build --build-arg PYVER=3.14 -t boxy:ci-hardened -f boxy/Containerfile boxy/
          docker build --build-arg PYVER=3.14 -t boxy:ci-slim -f boxy/Containerfile.slim boxy/
      - name: Smoke-test both flavors
        run: |
          for img in boxy:ci-hardened boxy:ci-slim; do
            docker run --rm "$img" --version
            docker run --rm --entrypoint /usr/bin/ssh "$img" -V   # no shell in the distroless runtime
          done
