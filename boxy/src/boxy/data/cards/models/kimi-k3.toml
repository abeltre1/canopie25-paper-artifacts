# moonshotai/Kimi-K3 — 2.8T-total / 104B-active MoE (896 experts, 16 active),
# 1M-token native context, MXFP4 weights + MXFP8 activations, ~1.56TB on disk
# (96 shards). Flags from the vLLM recipe (recipes.vllm.ai/moonshotai/Kimi-K3;
# day-0 support landed 2026-07-27, so the serving image must be from the
# July 2026 vLLM line or newer — kimi_k3 parsers and Kimi Delta Attention do
# not exist before that).
#
# GEOMETRY IS DERIVED, NOT HAND-SET: min_vram_gb x boxy's headroom = ~1950GB,
# so on an 8x256GB MI325X node the solver lands on ONE node at TP8 — exactly
# the recipe's published shape — and spills to a multi-node Ray instance on
# smaller parts (7 nodes on the assumed 4x80GB tier; 8 nodes / 32 ranks on
# 4x128GB MI300A). `gpus = 4` below is only the assumed-hardware advisory the
# calibration contract pins; a system card with the real node shape overrides
# it through fit_geometry().
#
# The recipe also passes `--load-format fastsafetensors` for faster cold loads.
# NOT set here: it hard-fails on any image without the fastsafetensors package,
# and a slow first load beats a crashed one. Add it back with
# `-- --load-format fastsafetensors` on an image known to carry it.
[model]
match = "moonshotai/Kimi-K3*"
engine = "vllm"
gpus = 4
min_vram_gb = 1560
native_ctx = 1048576
# KV bytes per token at bf16: KDA is a hybrid — the linear-attention majority
# of the 93 layers carries CONSTANT state (zero per-token KV) and only the MLA
# minority caches a compressed (kv_lora_rank 512 + qk_rope_head_dim 64) vector:
# 576 x 2 bytes x 24 MLA layers (a 3:1 KDA:MLA schedule) = 27648. PROVISIONAL
# pending verification against the staged config.json + the field-measured
# 'GPU KV cache size' line (the golden calibration test); safe either way on
# real K3 metal, where the derivation clamps at the native window long before
# the budget runs out. This is what turns the old hand-passed
# --max-model-len 131072 into a DERIVED near-native window.
kv_bytes_per_token = 27648
[model.args]
trust_remote_code = true
# FALLBACK cap for systems whose node VRAM boxy does not know: vLLM profiles
# KV for the FULL window at startup and can OOM blind. On a system card that
# declares real gpu_vram_gb this line is REPLACED by the derived largest
# context that provably fits (near-native on the fielded MI300A/H200 shapes —
# see native_ctx/kv_bytes_per_token above); `-- --max-model-len N` still wins.
max_model_len = 262144
enable_prefix_caching = true
reasoning_parser = "kimi_k3"
tool_call_parser = "kimi_k3"
enable_auto_tool_choice = true
[model.env.rocm]
# AITER OFF by default — vLLM falls back to TRITON_MLA, which runs on every
# CDNA part. FIELD (8x MI300A nodes, two full allocations burned): with
# AITER=1 the MLA backend picks its decode kernel by heads-per-rank, and on
# Kimi-K3 (96 heads) BOTH choices lose on gfx942 — TP4 gives 24 heads
# ('requires 1-15 for Gluon or a multiple of 16 for persistent'), and TP8
# gives 12, which selects the Gluon kernel... that asserts 'mla_gluon
# requires gfx950 (CDNA4), got gfx942' AFTER the full 87-minute weight load.
# The AITER=1 advice came from the Kimi K2.x recipes, written for newer
# silicon. On CDNA4 (MI350/MI355, gfx950) flip it back to "1" in a user card
# for the faster kernels.
VLLM_ROCM_USE_AITER = "0"
[model.images]
# The ROCm image is the one the recipe page itself names for K3
# (vllm/vllm-openai-rocm — HYPHEN: the first cut of this card used an
# underscore spelling from search-attested text and Docker Hub answered
# "requested access to the resource is denied", its phrasing for a repo that
# does not exist; field: 32 ranks retried that pull and the job died in 4s).
#
# CUDA: the K3-specific tag (Docker Hub layer page confirms it exists — the
# lesson of the rocm tag, applied). It is a CUDA-13 (cu130) build: the host
# needs an r580+ NVIDIA driver. Why not :latest — FIELD (2x H200 nodes):
# :latest ships no ray, boxy pip-installed it at container start, and the
# worker node dropped out of the Ray cluster in the 60s between formation and
# engine start; the placement group then waited forever for GPUs that no
# longer existed. The K3 tag is built for the recipe's multi-node serve.
cuda = "docker.io/vllm/vllm-openai:kimi-k3"
rocm = "docker.io/vllm/vllm-openai-rocm:latest"
[model.env.cuda]
# 1.56TB takes longer to load than vLLM's default engine-ready patience;
# recipe-recommended for K3 (a too-short timeout kills a HEALTHY load).
VLLM_ENGINE_READY_TIMEOUT_S = "3600"
